<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор квартир</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap">
<style>
/* Три экрана: комплекс → этаж → страница квартиры. Тёмный фон, светлые планы, янтарный акцент */
:root{
  --bg:#0b1220; --surface:#121b2b; --surface-2:#18243a; --fg:#eef2f7; --muted:#9aa6b8; --line:#24314a;
  --accent:#f5b54a; --accent-ink:#1a1206; --sel:#ffb02e;
  --free:#22a565; --booked:#c9a43a; --sold:#8a93a3;
  --plan:#f6f4ef; --plan-ink:#1d2533;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
[hidden],.pg-hide{display:none!important}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* ---------- Шапка ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:800}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.2vw,34px);letter-spacing:-.01em}
.summary{margin:4px 0 0;color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.summary b{color:var(--fg)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 14px;min-height:44px;cursor:pointer;font-size:14px;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn.link{border-color:transparent;color:var(--accent);padding:0 8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"].sl-btn{border-color:var(--free);color:#9be3bd}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px}
.badge:empty{display:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi span,.kpi small{font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--display);font-weight:500;font-size:clamp(16px,2vw,20px);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Фильтры ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.fgroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.flabel{font-weight:700;font-size:14px}
.fbar input,.fbar select{font:inherit;font-size:14px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
.fbar input{width:120px}
.fbar select{width:auto}
.fbar .seg button{padding:0 16px}
.fbar .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fbar .spacer{flex:1}
.fsheet-head,.fsheet-foot{display:none}
.fopen{display:none}

/* ---------- Навигация ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:14px;color:var(--muted)}
.crumbs button{border:0;background:none;color:var(--muted);cursor:pointer;min-height:44px;padding:0 6px}
.crumbs button:hover{color:var(--fg)}
.crumbs .cur{color:var(--accent);font-weight:700}
.crumbs .sep{opacity:.6}

/* ---------- Экран выбора: сцена + карточка ---------- */
#picker{margin:0;max-width:none;width:100%}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.stage{position:relative;border-radius:var(--r);overflow:hidden;background:#0f1a2e;min-width:0}
.stage.render{aspect-ratio:1500/844}
.stage.plan{background:#fff;height:clamp(440px,calc(100vh - 290px),720px)}
.stage.plan.wide{height:auto;aspect-ratio:920/520}
.stage svg{display:block;width:100%;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.zoomed svg,.stage.fs svg{touch-action:none;cursor:grab}
.stage.zoomed svg:active{cursor:grabbing}
.stage.fs{position:fixed;inset:0;z-index:60;border-radius:0;height:auto;aspect-ratio:auto}
body.fs-open{overflow:hidden}
.ctrls{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;z-index:4}
.ctrl{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(11,18,32,.82);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1}
.ctrl.txt{width:auto;padding:0 12px;font-size:13px;font-weight:700}
.ctrl:hover{background:rgba(11,18,32,.95)}
.fsinfo{position:absolute;left:12px;bottom:12px;z-index:4;background:rgba(11,18,32,.9);color:#fff;border-radius:10px;padding:8px 8px 8px 12px;display:none;gap:10px;align-items:center;font-size:14px;max-width:calc(100% - 260px)}
.stage.fs .fsinfo.on{display:flex}
.scene-enter{opacity:0}
.stage svg{transition:opacity .25s}

/* интерактивные зоны */
.zone{cursor:pointer;transition:fill .15s,stroke .15s}
.bld{fill:rgba(245,181,74,0);stroke:rgba(245,181,74,0);stroke-width:2;vector-effect:non-scaling-stroke}
.bld:hover,.bld.hov{fill:rgba(245,181,74,.18);stroke:#ffd08a}
.bld.sel{fill:rgba(245,181,74,.30);stroke:var(--sel);stroke-width:3}
.heat .bld{fill:var(--hf);stroke:rgba(255,255,255,.6);stroke-width:1.5}
.heat .bld.sel{stroke:var(--sel);stroke-width:3}
.band{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,.35);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.band:hover,.band.hov{fill:rgba(245,181,74,.5);stroke:#ffd08a;stroke-width:2}
.flab{cursor:pointer}
.flab.hov rect{fill:var(--accent)}
.flat{stroke:rgba(29,37,51,.55);stroke-width:1.5;vector-effect:non-scaling-stroke}
.flat.free{fill:rgba(34,165,101,.30)} .flat.booked{fill:rgba(201,164,58,.38)} .flat.sold{fill:rgba(120,128,142,.42)}
.flat.free:hover,.flat.free.hov{fill:rgba(34,165,101,.5)} .flat.booked:hover,.flat.booked.hov{fill:rgba(201,164,58,.58)} .flat.sold:hover,.flat.sold.hov{fill:rgba(120,128,142,.6)}
.ring-o{fill:none;stroke:#fff;stroke-width:9;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.ring-i{fill:none;stroke:var(--sel);stroke-width:4.5;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.zone:focus{outline:none}
.zone:focus-visible{stroke:#fff;stroke-width:3;stroke-dasharray:6 4}
.pin{pointer-events:none}

/* подсказка при наведении */
.tip{position:absolute;z-index:5;max-width:250px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);
  pointer-events:none;font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.show{opacity:1;transform:none}
.tip b{font-size:14px}
.tip .h{color:var(--muted);font-size:12px;margin-top:4px}

/* карточка справа */
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.side h2{font-family:var(--display);font-weight:700;font-size:24px}
.side .muted{color:var(--muted);margin:0}
.side .hl{color:var(--accent);font-weight:700;font-size:18px;margin:0}
.big{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.15}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:52px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:hover{background:var(--surface-2)}
.row b{font-size:17px}
.row span{color:var(--muted)}
.row[aria-pressed="true"]{background:var(--surface-2)}
.row[aria-pressed="true"] b{color:var(--accent)}
.row .chev{color:var(--muted);font-size:20px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.bgrid button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;line-height:1.15;padding:4px}
.bgrid button b{font-size:16px}
.bgrid button span{font-size:12px;color:#7fd3a7}
.bgrid button:hover{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}
.pill.free{background:var(--free)} .pill.booked{background:var(--booked);color:#1d1606} .pill.sold{background:var(--sold);color:#141a26}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.thumb{background:#fff;border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:contain;display:block}
.stack{display:grid;gap:8px}
.salesbox{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px;font-size:13px}
.minibar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.note{font-size:12px;color:var(--muted);margin:0}

.below{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.floorsw{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.floorsw button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.floorsw button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.heatbar{display:inline-block;width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsla(42,92%,70%,.6),hsla(12,92%,48%,.95))}

/* ---------- Список ---------- */
.list{display:grid;gap:14px;margin-top:8px}
.list-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.list-head h2{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.4vw,24px)}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 6px 0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip i{font-style:normal;color:var(--muted);font-size:18px;width:28px;text-align:center}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.list-head select{font:inherit;font-size:14px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;min-width:0}
.fcard:hover{border-color:#3a4a68}
.fcard .thumb{aspect-ratio:1;align-self:start}
.fcard .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard .num{font-family:var(--display);font-weight:500;font-size:17px}
.fcard .meta{color:var(--muted);font-size:13px}
.fcard .pr{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.fcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.fcard .acts .btn{flex:1 1 auto;padding:0 12px;font-size:13px}
.fcard .tw{position:relative;align-self:start}
.fcard .heart{position:absolute;top:4px;right:4px;width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(11,18,32,.85);border-color:transparent;color:#fff}
.fcard .heart[aria-pressed="true"]{color:#ff8fa3}
.more{justify-self:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;justify-items:start}
.empty p{margin:0}

/* ---------- Страница квартиры ---------- */
.fpage{display:grid;gap:18px}
.back{justify-self:start}
.fhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.fhead h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,40px)}
.fhead .pill{font-size:14px;padding:4px 12px}
.params{margin:-8px 0 0;font-size:17px;color:var(--fg)}
.params span{color:var(--muted);margin:0 6px}
.banner{border:1px solid var(--line);border-left:4px solid var(--booked);background:var(--surface);border-radius:10px;padding:12px 14px}
.banner.sold{border-left-color:var(--sold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;min-height:44px;padding:0 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:700}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.gal{position:relative;background:#fff;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3}
.gal>img,.gal>svg.fp{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18px}
.gal .stage{position:absolute;inset:0;border-radius:0;height:auto}
.gal .cap{position:absolute;left:14px;bottom:12px;font-size:12px;color:#6b7686;z-index:3}
.gal.fs{position:fixed;inset:0;z-index:60;border-radius:0;aspect-ratio:auto}
.buy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.buy .big{font-size:clamp(26px,3vw,34px)}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:12px;min-width:0;align-content:start}
.card2 h2{font-family:var(--display);font-weight:700;font-size:20px}
.card2 p{margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.chars{display:grid}
.chars div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;min-height:46px;border-bottom:1px solid var(--line)}
.chars div:last-child{border-bottom:0}
.chars i{font-style:normal;color:var(--accent);text-align:center}
.chars b{text-align:right}
.miniplan{background:#fff;border-radius:10px;border:0;padding:0;cursor:zoom-in;display:block;width:100%;aspect-ratio:16/10;overflow:hidden}
.miniplan svg{width:100%;height:100%;display:block}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.term{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:32px 1fr;gap:4px 12px;align-items:start}
.term i{font-style:normal;font-size:22px;color:var(--accent);grid-row:span 2}
.term span{color:var(--muted);font-size:14px}
.stickybuy{display:none}

/* ---------- Диалоги, тур, уведомления ---------- */
.modal{position:fixed;inset:0;z-index:70;background:rgba(4,8,16,.66);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:grid;gap:14px;position:relative}
.dialog h2{font-family:var(--display);font-size:20px;padding-right:40px}
.dialog .x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}
.sitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 6px 8px 12px;font-size:14px}
.sitem .warn{grid-column:1/-1;color:#f2c76b;font-size:13px}
.sitem .acts{display:flex;gap:4px}
.sitem .acts .btn{min-height:40px;padding:0 10px;font-size:13px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field textarea{font:inherit;font-size:15px;color:var(--fg);min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.field textarea{min-height:84px;resize:vertical}
.err{color:#ff8a7a;font-size:13px;margin:0}
.msg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.demo-warn{border:1px solid #6b5520;background:#2a2312;color:#f2d79b;border-radius:10px;padding:12px;font-size:14px}
.tour{position:fixed;z-index:75;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,calc(100% - 32px));
  background:var(--fg);color:var(--bg);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:8px}
.tour p{margin:0;font-size:15px}
.tour .st{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.tour .acts{display:flex;justify-content:flex-end;gap:8px}
.tour .btn{color:var(--bg);border-color:rgba(127,127,127,.5)}
.tour .btn.primary{color:var(--accent-ink)}
.toast{position:fixed;z-index:80;left:50%;top:16px;transform:translate(-50%,-140%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;transition:transform .2s;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.mkbar{position:absolute;z-index:8;left:12px;top:12px;max-width:min(420px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:8px;font-size:13px}
.mkbar p{margin:0}
.mkbar .acts{display:flex;gap:6px;flex-wrap:wrap}
.mkbar select{font:inherit;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.marking .band,.marking .flab{pointer-events:none}
.mkexport{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:13px}
.mkexport textarea{font:12px ui-monospace,Menlo,monospace;width:100%;min-height:70px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px}

/* ---------- Планшет и телефон ---------- */
@media (max-width:980px){
  .main,.fgrid{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  body{padding-top:14px}
  .actions{width:100%}

/* ===================== Масштаб и перемещение (общий для рендера и планов) ===================== */
function makeViewer(stageEl, svg, base, key, opt={}){
  let vb=(VB[key]||base).slice();
  const v={base, dragging:false};
  const set=()=>{ svg.setAttribute('viewBox',vb.join(' ')); VB[key]=vb.slice(); stageEl.classList.toggle('zoomed', vb[2]<base[2]-0.5) };
  const scale=w=>{ const r=svg.getBoundingClientRect(); return Math.min(r.width/w[2], r.height/w[3]) };
  const clamp=()=>{ vb[0]=Math.max(base[0],Math.min(base[0]+base[2]-vb[2],vb[0])); vb[1]=Math.max(base[1],Math.min(base[1]+base[3]-vb[3],vb[1])) };

  v.zoom=(f,cx,cy)=>{ if(cx==null){cx=vb[0]+vb[2]/2; cy=vb[1]+vb[3]/2}
    const z=Math.max(1,Math.min(opt.max||5, base[2]/vb[2]*f)), w=base[2]/z, h=base[3]/z;
    vb=[cx-(cx-vb[0])*w/vb[2], cy-(cy-vb[1])*h/vb[3], w, h]; clamp(); set() };
  v.fit=()=>{ vb=base.slice(); set() };
  v.get=()=>vb.slice();
  v.set=x=>{ vb=x.slice(); set() };
  const P=new Map(); let start=null, moved=false, pinch=null, suppress=false;
  svg.addEventListener('pointerdown',e=>{ P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===1){ start={x:e.clientX,y:e.clientY,vb:vb.slice()}; moved=false }
    if(P.size===2){ const [a,b]=[...P.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]), vb:vb.slice(), c:toSvg((a[0]+b[0])/2,(a[1]+b[1])/2)} } });
  svg.addEventListener('pointermove',e=>{ if(!P.has(e.pointerId)) return; P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===2 && pinch){ const [a,b]=[...P.values()]; vb=pinch.vb.slice(); v.zoom(Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d, ...pinch.c); moved=true; v.dragging=true; return }
    if(!start) return; const dx=e.clientX-start.x, dy=e.clientY-start.y;
    if(!moved && Math.hypot(dx,dy)<6) return;
    if(start.vb[2]>=base[2]-0.5) return;               // целиком вписан — двигать нечего
    if(!moved){ moved=true; v.dragging=true; try{svg.setPointerCapture(e.pointerId)}catch(_){} hideTip() }
    const s=scale(start.vb); vb=[start.vb[0]-dx/s, start.vb[1]-dy/s, vb[2], vb[3]]; clamp(); set() });
  const end=e=>{ P.delete(e.pointerId); if(P.size<2) pinch=null; if(!P.size){ if(moved){ suppress=true; setTimeout(()=>{suppress=false; v.dragging=false},0) } start=null; moved=false } };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('click',e=>{ if(suppress){ e.stopPropagation(); e.preventDefault() } },true);
  svg.addEventListener('wheel',e=>{ if(!(e.ctrlKey||e.metaKey||stageEl.classList.contains('fs'))) return; e.preventDefault(); v.zoom(e.deltaY<0?1.15:1/1.15, ...toSvg(e.clientX,e.clientY)) },{passive:false});
  set(); return v;
}
function animVB(svg, from, to, ms){
  return new Promise(res=>{
    if(reduced){ svg.setAttribute('viewBox',to.join(' ')); return res() }
    const t0=performance.now(), ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    (function step(now){ const p=Math.min(1,(now-t0)/ms), k=ease(p);
      svg.setAttribute('viewBox', from.map((x,i)=>x+(to[i]-x)*k).join(' ')); p<1?requestAnimationFrame(step):res() })(t0);
  });
}

const heatColor=v=>{ const t=Math.max(0,Math.min(1,(v-0.4)/0.35)); return `hsla(${(42-30*t).toFixed(0)},92%,${(70-22*t).toFixed(0)}%,${(.35+.4*t).toFixed(2)})` };

function sceneFacade(b){

  const ext=30, extend=l=>{ const a=l[0],a2=l[1],z=l[l.length-1],z2=l[l.length-2];
    const sa=(a2[1]-a[1])/((a2[0]-a[0])||1), sz=(z[1]-z2[1])/((z[0]-z2[0])||1);
    return [[a[0]-ext,a[1]-sa*ext],...l,[z[0]+ext,z[1]+sz*ext]] };

function sceneSig(){ return [CUR.level, CUR.b||'', CUR.f||'', MODE, F.type, F.min, F.max, CUR.level==='complex'?CUR.b:''].join('|') }
async function mountScene(prev, fromPage){

  if(CUR.level==='floor'){ const r=sceneFloor(b,CUR.f); body=r.svg; base=r.vb; cls='plan'+(r.wide?' wide':'') }

  stageEl.className='stage '+cls+(keepFs?' fs':'');

    const bands=svgEl.querySelector('#bands'), lbls=svgEl.querySelector('#lbls'); bands.style.opacity=0; lbls.style.opacity=0;
    await animVB(svgEl, from, base, 650); bands.style.transition=lbls.style.transition='opacity .3s'; bands.style.opacity=1; lbls.style.opacity=1;
  } else if(!reduced && prevLvl==='facade' && CUR.level==='complex' && prev.b){

function bindZones(svg){
  svg.querySelectorAll('[data-z]').forEach(el=>{
    const kind=el.dataset.z, key=el.dataset.key, zk=kind==='band'?'f'+key:key;
    el.addEventListener('pointerenter',e=>{ if(e.pointerType!=='mouse'||viewer?.dragging) return; hov(el,true); showTip(zk,el) });
    el.addEventListener('pointerleave',e=>{ if(e.pointerType!=='mouse') return; hov(el,false); hideTip() });
    el.addEventListener('focus',()=>{ hov(el,true); showTip(zk,el) });
    el.addEventListener('blur',()=>{ hov(el,false); hideTip() });
    el.addEventListener('click',()=>activate(kind,key));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activate(kind,key) } });
  });
}
function hov(el,on){ const k=el.dataset.key, z=el.dataset.z; svgEl&&svgEl.querySelectorAll(`[data-z="${z}"][data-key="${k}"]`).forEach(x=>x.classList.toggle('hov',on)) }
function activate(kind,key){
  if(MK) return;
  hideTip();
  if(kind==='bld'){ if(CUR.b===key && CUR.level==='complex') go({b:key,level:'facade'}); else go({b:key},{replace:CUR.level==='complex'&&!!CUR.b}) }
  else if(kind==='band') go({b:CUR.b,f:+key,level:'floor'});
  else if(kind==='flat') go({b:CUR.b,f:CUR.f,level:'floor',sel:key},{replace:true});
}
function showTip(zk,el){
  const z=zones[zk]; if(!z) return;
  tip.innerHTML=z.tip(); tip.classList.add('show');
  // рядом с объектом, а не поверх него
  const W=stageEl.clientWidth,H=stageEl.clientHeight,cw=tip.offsetWidth,ch=tip.offsetHeight, w=stageEl.getBoundingClientRect(), r=el.getBoundingClientRect();
  const L=r.left-w.left,T=r.top-w.top,Rr=r.right-w.left,B=r.bottom-w.top;
  let l, t=Math.max(8,Math.min(H-ch-8,(T+B)/2-ch/2));
  if(Rr+10+cw<=W-8) l=Rr+10; else if(L-10-cw>=8) l=L-10-cw;
  else { l=Math.max(8,Math.min(W-cw-8,(L+Rr)/2-cw/2)); t=T-ch-10>=8?T-ch-10:Math.min(H-ch-8,B+10) }
  tip.style.left=l+'px'; tip.style.top=t+'px';
}
function hideTip(){ tip.classList.remove('show') }

/* Схематичная планировка для корпусов без настоящих планов */
const LAYOUTS={
 '1+1':[['bal',0,40,36,100],['bed',36,0,110,66],['bath',146,0,54,66],['liv',36,66,164,74]],
 '2+1':[['bal',0,40,36,100],['bed',36,0,74,66],['bath',110,0,44,66],['bed',154,0,46,140],['liv',36,66,118,74]],
 '3+1':[['bal',0,40,36,100],['bed',36,0,64,66],['bath',100,0,36,33],['bath',100,33,36,33],['bed',136,0,64,66],['liv',36,66,104,74],['bed',140,66,60,74]]};
function schemeSvg(q){
  let s=`<svg class="fp" viewBox="-8 -8 216 156" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема планировки ${q.type}">`;
  LAYOUTS[q.type].forEach(([k,x,y,w,h])=>{ const fill=k==='bath'?'#e3e8ec':k==='bal'?'#ece8e1':'#d8b384';
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#3b3b3b" stroke-width="${k==='bal'?1:2.2}"/>`;
    if(k==='bed'){ const cx=x+w/2, cy=y+h/2, bw=Math.min(w*.6,40), bh=Math.min(h*.55,34); s+=`<rect x="${cx-bw/2}" y="${cy-bh/2}" width="${bw}" height="${bh}" rx="2" fill="#f4f1ea" stroke="#9aa3ad" stroke-width=".6"/><rect x="${cx-bw/2}" y="${cy-bh/2+bh*.45}" width="${bw}" height="${bh*.55}" fill="#5d6f8f" opacity=".75"/>` } });
  return s+`<text x="100" y="152" text-anchor="middle" font-family="Manrope" font-size="8" fill="#6b7686">схема для демо</text></svg>`;
}

const mkBar=$('#mkBar'); let MK=null;
function svgPt(e){ const pt=svgEl.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const r=pt.matrixTransform(svgEl.getScreenCTM().inverse()); return [Math.round(r.x),Math.round(r.y)] }
const MK_TEXT={p:['Шаг 1 из 3 · Контур корпуса','Кликайте по углам корпуса по кругу, включая крышу. Можно оставить старый контур.'],
  t:['Шаг 2 из 3 · Верх верхнего этажа','Слева направо по линии потолка верхнего этажа, точка на каждом изломе фасада.'],
  bt:['Шаг 3 из 3 · Низ первого этажа','Столько же точек в том же порядке по линии пола первого этажа.'],done:['Проверьте этажи','Пунктир показывает границы этажей.']};
function mkDraw(){ let g=svgEl.querySelector('#mk'); if(!g){ g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.id='mk'; g.setAttribute('pointer-events','none'); svgEl.appendChild(g) }
  const k=svgEl.viewBox.baseVal.height/700, col={p:'#fff',t:'#3fd0ff',bt:'#ff5ad1'}; let h='';
  ['p','t','bt'].forEach(key=>{ const a=MK[key]; if(!a.length) return; const closed=key==='p'&&MK.step!=='p';
    h+=`<polyline points="${pts(closed?a.concat([a[0]]):a)}" fill="none" stroke="${col[key]}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
    a.forEach(q=>h+=`<circle cx="${q[0]}" cy="${q[1]}" r="${4*k}" fill="${col[key]}" stroke="#000" vector-effect="non-scaling-stroke"/>`) });
  if(MK.t.length>=2&&MK.bt.length===MK.t.length) for(let i=1;i<MK.f;i++) h+=`<polyline points="${pts(MK.t.map((q,j)=>[q[0]+(MK.bt[j][0]-q[0])*i/MK.f,q[1]+(MK.bt[j][1]-q[1])*i/MK.f]))}" fill="none" stroke="#ffc070" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  g.innerHTML=h }
function mkUI(){ const st=MK.step, [t,x]=MK_TEXT[st], need=st==='bt'?` Нужно точек: ${MK.t.length}, поставлено: ${MK.bt.length}.`:'';
  mkBar.innerHTML=`<b>${t}</b><p>${x}${need}</p><label>Жилых этажей <select id="mkF">${[...Array(14)].map((_,i)=>i+2).map(n=>`<option ${n===MK.f?'selected':''}>${n}</option>`).join('')}</select></label>
    <div class="acts">${st!=='done'?'<button class="btn" id="mkUndo">↶ Точка</button>':''}${st==='p'?'<button class="btn" id="mkSkip">Оставить контур</button>':''}${st==='p'||st==='t'?'<button class="btn primary" id="mkNext">Далее</button>':''}${st==='done'?'<button class="btn" id="mkRedo">Заново</button><button class="btn primary" id="mkSave">Сохранить</button>':''}<button class="btn" id="mkCancel">Отмена</button></div>`;

  on('mkSkip',()=>{ MK.p=MK.b.g.p.map(q=>q.slice()); MK.step='t'; mkDraw(); mkUI() });

let tourI=-1;
async function tourGo(i){ tourI=i; if(i>=TOUR.length) return tourEnd();
  $('#tour').hidden=false; $('#tourStep').textContent=`Шаг ${i+1} из ${TOUR.length}`; $('#tourText').textContent=TOUR[i][0];
  $('#tourNext').textContent=i===TOUR.length-1?'Готово':'Далее →'; $('#tourNext').disabled=true;
  try{ await TOUR[i][1]() } finally { $('#tourNext').disabled=false; $('#tourNext').focus({preventScroll:true}) } }
function tourEnd(){ tourI=-1; $('#tour').hidden=true; hideTip() }
$('#tourBtn').onclick=()=>tourGo(0); $('#tourNext').onclick=()=>tourGo(tourI+1); $('#tourStop').onclick=tourEnd;

/* ===================== Клавиатура и запуск ===================== */
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  if(!modal.hidden) return closeModal();
  if($('#fbar').classList.contains('open')) return sheet(false);
  const fs=document.querySelector('.fs'); if(fs){ fsToggle(fs,false); if(fs.id==='gal'&&CUR.page) renderGal(FLAT[CUR.page]); return }
  if(MK) return mkStop();
  if(!$('#tour').hidden) return tourEnd(); });
{ const {st,flt}=parse(location.hash); Object.assign(F,flt); APPLIED=''; CUR={level:'complex',b:null,f:null,sel:null,page:null}; apply(st,{}); BOOTED=true; try{ history.replaceState(null,'',hashOf(st)) }catch(e){} }
